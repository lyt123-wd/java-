services:
  mysql:
    image: mysql:8.0
    container_name: tandian-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-tandian123}
      MYSQL_DATABASE: ${DB_NAME:-tandian}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      # 宿主机 3307，避免和本机已有 MySQL 冲突
      - "${DB_EXPOSE_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/tandian.sql:/docker-entrypoint-initdb.d/01-tandian.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tandian-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tandian-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-tandian}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-tandian123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      UPLOAD_DIR: /app/uploads
      INIT_GEO_ENABLED: "true"
      INIT_STOCK_ENABLED: "true"
      LOG_LEVEL: info
    ports:
      - "${SERVER_PORT:-8081}:8081"
    volumes:
      - uploads:/app/uploads

volumes:
  mysql-data:
  redis-data:
  uploads:
