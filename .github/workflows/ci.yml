name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tandian:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tandian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean package

  yujian-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yujian/lease
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean package

  yujian-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yujian/rentHouseAdmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: yujian/rentHouseAdmin/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          HUSKY: 0
      - run: npm run build

  yujian-h5:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yujian/rentHouseH5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: yujian/rentHouseH5/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          HUSKY: 0
      - run: npm run build

  plant-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plant-disease/plant-disease-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean package

  plant-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plant-disease/plant-disease-web/plant-disease-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plant-disease/plant-disease-web/plant-disease-web/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          HUSKY: 0
      - run: npm run build
